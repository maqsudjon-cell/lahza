<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albomni boshqarish · Chaqnoq</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { padding: 32px 0 64px; }
  /* minmax(0,1fr) va min-width:0 shart — aks holda ichkaridagi uzun havola
     grid ustunini qisqarishga qo'ymaydi va sahifa chetdan chiqib ketadi. */
  .qr-card { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 22px; align-items: center; }
  .qr-card > * { min-width: 0; }
  /* `justify-items: center` bu yerda ISHLATILMAYDI: u grid elementini
     cho'zilishdan kontent kengligiga o'tkazadi va uzun havola yana
     sahifani chetdan chiqarib yuboradi. Markazlash matn orqali qilinadi. */
  @media (max-width: 520px) {
    .qr-card { grid-template-columns: minmax(0, 1fr); text-align: center; }
    .qr-card > img { margin-inline: auto; }
  }
  .qr-card img { width: 132px; height: 132px; border-radius: var(--r-s); border: 1px solid var(--border); }

  .linkbox {
    display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: var(--r-m); padding: 6px 6px 6px 14px;
  }
  .linkbox code { font-family: var(--mono);
    flex: 1 1 auto; min-width: 0; font-size: .875rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg);
  }
  .linkbox .btn { padding: 9px 16px; min-height: 40px; font-size: .875rem; flex: none; }

  /* Grid, flex emas: flex'da ustun eni yorliq matniga qarab o'zgarardi
     ("RASM" va "KUN QOLDI" har xil enli) va "15" bilan "60" yonma-yon
     yopishib, bitta "15 60" raqamiday o'qilardi. */
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 20px; }
  .stat b { font-size: 2.125rem; font-weight: 600; display: block; line-height: 1; letter-spacing: -.04em; }
  .stat span { font-family: var(--mono); font-size: .6875rem; color: var(--subtle); letter-spacing: .1em; }

  /* Kontent kengligidagi tugmalar chapga tekislanganda ikkitasi har xil
     enli bo'lib "tugallanmagan" ko'rinish berardi — pastdagi ZIP tugmasi
     esa to'liq enli edi. Endi bitta qoida: joy yetsa yonma-yon, yetmasa
     ustma-ust, lekin doim teng enli. */
  .actions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .actions .btn { width: 100%; }

  /* Albomni yo'qotishning yagona yo'li — shu havolani yo'qotish.
     Avval bu sahifadagi eng kichik, eng xira matn edi. */
  .keep { border: 1px solid var(--border-strong); border-radius: var(--r-m); padding: 16px 18px; margin-top: 24px; }
  .keep strong { display: block; margin-bottom: 6px; }
  .keep p { margin: 0 0 12px; font-size: .875rem; }

  .album-item {
    display: block; padding: 16px 18px; border: 1px solid var(--border);
    border-radius: var(--r-m); background: var(--surface); text-decoration: none;
    margin-bottom: 10px;
  }
  .album-item:hover { border-color: var(--fg); }
</style>
</head>
<body>

<div class="wrap narrow" id="app">
  <div class="center"><span class="spinner" style="color:var(--muted)"></span></div>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const id  = params.get('i');
const key = params.get('k');
const app = document.getElementById('app');

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function formatDate(iso) {
  const months = ['yanvar','fevral','mart','aprel','may','iyun',
                  'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const d = new Date(iso + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? iso : `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

const ALBOM_KALITI = 'chaqnoq.albums';
// Brend ikki marta o'zgargan — eski kalitlardagi albomlar yo'qolmasligi kerak.
const ESKI_KALITLAR = ['pufak.albums', 'lahza.albums'];

function savedAlbums() {
  try {
    const bor = JSON.parse(localStorage.getItem(ALBOM_KALITI) || '[]');
    if (bor.length) return bor;
    for (const k of ESKI_KALITLAR) {
      const eski = JSON.parse(localStorage.getItem(k) || '[]');
      if (eski.length) {
        localStorage.setItem(ALBOM_KALITI, JSON.stringify(eski));
        return eski;
      }
    }
    return [];
  } catch { return []; }
}

/* --- Ro'yxat (havolasiz kirilganda) -------------------------------------- */

function renderList() {
  const albums = savedAlbums();
  app.innerHTML = `
    <a class="brand" href="/">Chaqnoq</a>
    <h1 style="margin-bottom:8px">Albomlarim</h1>
    <p class="muted">Shu brauzerda yaratilgan albomlar.</p>
    ${albums.length
      ? albums.map(a => `
        <a class="album-item" href="/boshqarish/?i=${esc(a.id)}&k=${esc(a.k)}">
          <strong>${esc(a.title)}</strong>
          <div class="small muted">${esc(formatDate(a.date))}</div>
        </a>`).join('')
      : `<div class="note">Hozircha albom yo'q.</div>`}
    <p style="margin-top:26px"><a class="btn btn-ghost" href="/yaratish/">Yangi albom yaratish</a></p>
    <p class="small muted" style="margin-top:20px">
      Albom havolasi faqat shu brauzerda saqlanadi. Boshqa telefondan kirish uchun
      boshqaruv havolasini o'zingizga saqlab qo'ying.
    </p>`;
}

/* --- Bitta albom --------------------------------------------------------- */

function render(meta, count) {
  const guestUrl = `${location.origin}/e/?i=${meta.id}`;
  document.title = `${meta.title} · Chaqnoq`;

  const days = meta.expiresAt
    ? Math.max(0, Math.ceil((new Date(meta.expiresAt) - Date.now()) / 86400000))
    : null;

  app.innerHTML = `
    <a class="brand" href="/">Chaqnoq</a>
    <h1 style="margin-bottom:6px">${esc(meta.title)}</h1>
    <p class="muted" style="margin-bottom:30px">${esc(formatDate(meta.date))}</p>

    <div class="card stack stack-24" style="margin-bottom:18px">
      <div class="qr-card">
        <img src="/api/qr/${encodeURIComponent(meta.id)}" alt="Albom QR kodi" width="132" height="132">
        <div>
          <h3 style="margin-bottom:6px">Mehmonlar uchun havola</h3>
          <p class="small muted" style="margin-bottom:12px">
            Bu QR kodni stollarga qo'ying. Mehmon skanerlaydi va rasm qo'shadi —
            ilova o'rnatmasdan, ro'yxatdan o'tmasdan.
          </p>
          <div class="linkbox">
            <code id="link">${esc(guestUrl)}</code>
            <button class="btn btn-ghost" id="copy" type="button">Nusxa</button>
          </div>
        </div>
      </div>

      <hr class="rule">

      <div class="actions">
        <a class="btn btn-primary" href="/qr/?i=${encodeURIComponent(meta.id)}" target="_blank" rel="noopener">
          QR varaqasini chop etish
        </a>
        <a class="btn btn-ghost" href="/e/?i=${encodeURIComponent(meta.id)}" target="_blank" rel="noopener">
          Albomni ko'rish
        </a>
      </div>
    </div>

    <div class="card stack stack-24">
      <div class="stat">
        <div><b class="mono" id="count">${count}</b><span>RASM</span></div>
        ${days !== null ? `<div><b class="mono">${days}</b><span>KUN QOLDI</span></div>` : ''}
      </div>

      <hr class="rule">

      <div>
        <h3 style="margin-bottom:6px">Barcha rasmlarni yuklab olish</h3>
        <p class="small muted" style="margin-bottom:14px">
          Hammasi bitta ZIP faylda. Rasmlar 1920px gacha kichraytirilgan —
          ko'rish va odatiy chop etishga yetadi. Albom
          ${days !== null ? `${days} kundan keyin` : 'muddati tugagach'}
          o'chiriladi — shu vaqtgacha yuklab oling.
        </p>
        <a class="btn btn-primary btn-block ${count ? '' : 'hidden'}"
           href="/api/zip/${encodeURIComponent(meta.id)}?k=${encodeURIComponent(key)}">
          ZIP faylni yuklab olish
        </a>
        ${count ? '' : '<div class="note">Albomda hali rasm yo\'q.</div>'}
      </div>
    </div>

    <div class="keep">
      <strong>Bu sahifaning havolasini saqlab qo'ying</strong>
      <p class="muted">Albomingizga kirishning yagona kaliti shu havola —
      parol ham, akkaunt ham yo'q. Havola yo'qolsa albomni qaytarib bo'lmaydi.
      O'zingizga yuborib qo'ying.</p>
      <button class="btn btn-ghost" id="copyManage" type="button">Boshqaruv havolasidan nusxa olish</button>
    </div>`;

  document.getElementById('copy').addEventListener('click', async (e) => {
    try {
      await navigator.clipboard.writeText(guestUrl);
      e.target.textContent = 'Nusxa olindi';
      setTimeout(() => (e.target.textContent = 'Nusxa'), 1800);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('link'));
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  // Boshqaruv havolasi — shu sahifaning o'zi (id + kalit manzilda turadi).
  document.getElementById('copyManage').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(location.href);
      btn.textContent = 'Nusxa olindi — endi o\'zingizga yuboring';
    } catch {
      btn.textContent = 'Nusxa olinmadi — manzil qatoridan ko\'chiring';
    }
    setTimeout(() => (btn.textContent = 'Boshqaruv havolasidan nusxa olish'), 2600);
  });
}

/* --- Ishga tushirish ----------------------------------------------------- */

(async function init() {
  if (!id || !key) return renderList();

  try {
    const [metaRes, photosRes] = await Promise.all([
      fetch(`/api/event/${encodeURIComponent(id)}`),
      fetch(`/api/photos/${encodeURIComponent(id)}`),
    ]);
    if (!metaRes.ok) {
      app.innerHTML = `<a class="brand" href="/">Chaqnoq</a>
        <div class="note note-err">Albom topilmadi yoki muddati tugagan.</div>`;
      return;
    }
    const meta = await metaRes.json();
    const count = photosRes.ok ? (await photosRes.json()).photos.length : 0;
    render(meta, count);
  } catch {
    app.innerHTML = `<a class="brand" href="/">Chaqnoq</a>
      <div class="note note-err">Ulanishda muammo bo'ldi. Sahifani yangilang.</div>`;
  }
})();
</script>
<script data-goatcounter="https://chaqnoq.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
