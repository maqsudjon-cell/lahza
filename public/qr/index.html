<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR varaqasi · Lahza</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* Bu sahifa stolga qo'yiladigan qog'oz. Ekranda ko'rinishi qog'ozning
     ko'rinishi bilan bir xil bo'lishi kerak, shuning uchun A5 nisbatida. */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 13px var(--pad);
  }
  .toolbar .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; max-width: var(--wrap); }
  .toolbar .btn { padding: 9px 18px; min-height: 40px; font-size: .875rem; }

  .stage { padding: 32px var(--pad) 56px; display: grid; place-items: center; }

  .sheet {
    width: 148mm; max-width: 100%;
    aspect-ratio: 148 / 210;
    background: #ffffff;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgb(10 10 10 / .12), 0 18px 50px -24px rgb(10 10 10 / .35);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 15mm 13mm;
  }

  /* Qog'oz har doim oq-qora. Sahifaning qorong'i rejimi unga tegmasligi kerak,
     aks holda base.css dagi umumiy matn rangi oq fonda oqarib ketadi. */
  .sheet, .sheet * { color: #0a0a0a; }
  .sheet .kicker, .sheet .date, .sheet .hint { color: #6b6b6b; }
  .sheet .foot { color: #9a9a9a; }

  .sheet .kicker {
    font-family: var(--mono);
    font-size: 2.9mm; letter-spacing: .24em; text-transform: uppercase;
    margin-bottom: 8mm;
  }
  .sheet .names {
    font-size: 10mm; line-height: 1.08; font-weight: 600;
    letter-spacing: -.03em; margin: 0 0 3mm;
  }
  .sheet .date {
    font-family: var(--mono);
    font-size: 3mm; letter-spacing: .18em; text-transform: uppercase;
    margin-bottom: 11mm;
  }

  .sheet .qr {
    width: 64mm; height: 64mm;
    padding: 3mm; background: #fff;
    box-shadow: 0 0 0 1px rgb(10 10 10 / .12);
    border-radius: 1.5mm;
  }
  .sheet .qr img { width: 100%; height: 100%; }

  .sheet .call {
    font-size: 5.2mm; line-height: 1.28; font-weight: 600; letter-spacing: -.02em;
    margin: 10mm 0 3.5mm; max-width: 98mm;
  }
  .sheet .hint { font-size: 3.3mm; line-height: 1.5; max-width: 92mm; margin: 0; }
  .sheet .foot {
    margin-top: auto; padding-top: 8mm;
    font-family: var(--mono);
    font-size: 2.7mm; letter-spacing: .2em; text-transform: uppercase;
  }

  @media print {
    @page { size: A5 portrait; margin: 0; }
    html, body { background: #fff !important; }
    .toolbar, .print-hint { display: none !important; }
    .stage { padding: 0; display: block; }
    .sheet {
      width: 148mm; height: 210mm; aspect-ratio: auto;
      border-radius: 0; box-shadow: none;
      page-break-inside: avoid;
    }
    .sheet .qr { box-shadow: none; border: 0.3mm solid #ddd; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="wrap">
    <a href="javascript:history.back()" class="small muted" style="text-decoration:none">&larr; Orqaga</a>
    <button class="btn btn-primary" id="print" type="button">Chop etish / PDF</button>
  </div>
</div>

<div class="stage">
  <div class="sheet" id="sheet">
    <span class="spinner" style="color:#6b6b6b"></span>
  </div>
</div>

<p class="small muted center print-hint" style="margin:0 0 40px">
  Chop etish oynasida qog'oz o'lchamini <strong>A5</strong> qilib tanlang.
  Chiqaruvchi <em>Save as PDF</em> ni tanlasangiz, PDF sifatida saqlanadi.
</p>

<script type="module">
const id = new URLSearchParams(location.search).get('i');
const sheet = document.getElementById('sheet');
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function formatDate(iso) {
  const months = ['yanvar','fevral','mart','aprel','may','iyun',
                  'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const d = new Date(iso + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? '' : `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

document.getElementById('print').addEventListener('click', () => window.print());

(async function init() {
  if (!id) { sheet.textContent = 'Havola to\'liq emas.'; return; }

  const res = await fetch(`/api/event/${encodeURIComponent(id)}`);
  if (!res.ok) { sheet.textContent = 'Albom topilmadi.'; return; }
  const meta = await res.json();

  document.title = `${meta.title} — QR varaqasi`;
  sheet.innerHTML = `
    <div class="kicker">Umumiy albom</div>
    <h1 class="names">${esc(meta.title)}</h1>
    <div class="date">${formatDate(meta.date)}</div>
        <div class="qr">
      <img src="/api/qr/${encodeURIComponent(meta.id)}" alt="QR kod" width="240" height="240">
    </div>

    <p class="call">Bugungi suratlaringizni biz bilan bo'lishing</p>
    <p class="hint">
      Telefon kamerangizni QR kodga tuting va ochilgan sahifaga rasmlaringizni
      qo'shing. Ilova o'rnatish yoki ro'yxatdan o'tish shart emas.
    </p>

    <div class="foot">Lahza</div>`;
})();
</script>
</body>
</html>
