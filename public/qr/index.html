<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR varaqasi · Chaqnoq</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/inter-var-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/plex-mono-400-latin.woff2">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* Bu sahifa stolga qo'yiladigan qog'oz.
     Varaqa A5 (148mm) kengligida, lekin telefon ekrani undan tor. Shuning
     uchun ichkaridagi barcha o'lchamlar `cqw` — varaqa kengligining ulushi.
     148mm = 100cqw, ya'ni 1mm = 0.676cqw. Natijada varaqa qanchalik
     kichraysa, matn ham shunchalik kichrayadi va chop etishda o'lcham
     aynan A5 uchun mo'ljallangandek chiqadi. */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 13px var(--pad);
  }
  .toolbar .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; max-width: var(--wrap); }
  .toolbar .btn { padding: 9px 18px; min-height: 40px; font-size: .875rem; }
  /* Yonidagi tugma 40px, bu esa 22px edi — bir xil panelda ikki xil
     o'lcham. Tag chizig'i ham qo'shildi: strelka bor deb havola ekani
     o'z-o'zidan bilinmaydi. */
  .toolbar .back {
    display: inline-flex; align-items: center; min-height: 40px; padding: 9px 0;
    text-decoration: underline; text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }
  .toolbar .back:hover { color: var(--fg); text-decoration-color: currentColor; }

  /* minmax(0,1fr) shart: ustun `auto` bo'lsa varaqaning kontent kengligiga
     cho'ziladi va `max-width:100%` hech narsani cheklamay qo'yadi. */
  .stage {
    padding: 28px var(--pad) 48px;
    display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center;
  }

  .sheet {
    width: 148mm;
    max-width: 100%;
    aspect-ratio: 148 / 210;
    background: #ffffff;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgb(10 10 10 / .12), 0 18px 50px -24px rgb(10 10 10 / .35);
    container-type: inline-size;
    display: flex;
    overflow: hidden;
  }
  .sheet-inner {
    width: 100%;
    padding: 10.1cqw 8.8cqw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }

  /* Qog'oz har doim oq-qora — sahifaning qorong'i rejimi unga tegmaydi */
  .sheet, .sheet * { color: #0a0a0a; }
  .sheet .kicker, .sheet .date, .sheet .hint { color: #6b6b6b; }
  .sheet .foot { color: #9a9a9a; }

  .sheet .kicker {
    font-family: var(--mono);
    font-size: 1.96cqw; letter-spacing: .24em; text-transform: uppercase;
    margin-bottom: 5.4cqw;
  }
  .sheet .names {
    font-size: 6.8cqw; line-height: 1.08; font-weight: 600;
    letter-spacing: -.03em; margin: 0 0 2cqw;
  }
  .sheet .date {
    font-family: var(--mono);
    font-size: 2cqw; letter-spacing: .18em; text-transform: uppercase;
    margin-bottom: 7.4cqw;
  }

  .sheet .qr {
    width: 43.2cqw; height: 43.2cqw;
    padding: 2cqw; background: #fff;
    box-shadow: 0 0 0 1px rgb(10 10 10 / .12);
    border-radius: 1cqw;
  }
  .sheet .qr img { width: 100%; height: 100%; }

  .sheet .call {
    font-size: 3.5cqw; line-height: 1.28; font-weight: 600; letter-spacing: -.02em;
    margin: 6.8cqw 0 2.4cqw; max-width: 66cqw;
  }
  .sheet .hint { font-size: 2.2cqw; line-height: 1.5; max-width: 62cqw; margin: 0; }

  /* Kamerasi eski yoki QR o'qimaydigan telefon uchun yagona yo'l.
     Identifikatorda chalkashadigan belgilar (0/O, 1/l/I) yo'q — alifbo
     aynan shuning uchun o'sha belgilarsiz tanlangan. */
  .sheet .manzil {
    margin: 4.6cqw 0 0; font-size: 2cqw; line-height: 1.65; color: #6b6b6b;
  }
  .sheet .manzil b {
    font-family: var(--mono); font-weight: 500;
    font-size: 2.7cqw; letter-spacing: .03em; color: #1A1A18;
  }
  .sheet .foot {
    margin-top: auto; padding-top: 5.4cqw;
    font-family: var(--mono);
    font-size: 1.8cqw; letter-spacing: .2em; text-transform: uppercase;
  }

  /* Konteyner so'rovlari yo'q brauzerlar (Safari 16 dan eski, Chrome 105
     dan eski) uchun eski `mm` o'lchamlari. Bunday brauzerda varaqa tor
     ekranga sig'maydi, lekin matn to'g'ri proporsiyada qoladi va chop
     etishda muammosiz chiqadi. */
  @supports not (container-type: inline-size) {
    .sheet-inner { padding: 15mm 13mm; }
    .sheet .kicker { font-size: 2.9mm; margin-bottom: 8mm; }
    .sheet .names  { font-size: 10mm; margin: 0 0 3mm; }
    .sheet .date   { font-size: 3mm; margin-bottom: 11mm; }
    .sheet .qr     { width: 64mm; height: 64mm; padding: 3mm; border-radius: 1.5mm; }
    .sheet .call   { font-size: 5.2mm; margin: 10mm 0 3.5mm; max-width: 98mm; }
    .sheet .hint   { font-size: 3.3mm; max-width: 92mm; }
    .sheet .manzil { font-size: 3mm; margin-top: 6.8mm; }
    .sheet .manzil b { font-size: 4mm; }
    .sheet .foot   { padding-top: 8mm; font-size: 2.7mm; }
  }

  @media print {
    @page { size: A5 portrait; margin: 0; }
    html, body { background: #fff !important; }
    .toolbar, .print-hint { display: none !important; }
    .stage { padding: 0; display: block; }
    .sheet {
      width: 148mm; max-width: none; height: 210mm; aspect-ratio: auto;
      border-radius: 0; box-shadow: none;
      page-break-inside: avoid;
    }
    .sheet .qr { box-shadow: none; border: 0.3mm solid #ddd; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="wrap">
    <a href="javascript:history.back()" class="small muted back">&larr; Orqaga</a>
    <button class="btn btn-primary" id="print" type="button">Chop etish / PDF</button>
  </div>
</div>

<div class="stage">
  <div class="sheet">
    <div class="sheet-inner" id="sheet">
      <span class="spinner" style="color:#6b6b6b"></span>
    </div>
  </div>
</div>

<p class="small muted center print-hint" style="margin:0 auto 40px;max-width:44rem;padding:0 var(--pad)">
  Chop etish oynasida qog'oz o'lchamini <strong>A5</strong> qilib tanlang.
  Chiqaruvchi <em>Save as PDF</em> ni tanlasangiz, PDF sifatida saqlanadi.
</p>

<script type="module">
const id = new URLSearchParams(location.search).get('i');
const sheet = document.getElementById('sheet');
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function formatDate(iso) {
  const months = ['yanvar','fevral','mart','aprel','may','iyun',
                  'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const d = new Date(iso + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? '' : `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

document.getElementById('print').addEventListener('click', () => window.print());

(async function init() {
  if (!id) { sheet.textContent = 'Havola to\'liq emas.'; return; }

  const res = await fetch(`/api/event/${encodeURIComponent(id)}`);
  if (!res.ok) { sheet.textContent = 'Albom topilmadi.'; return; }
  const meta = await res.json();

  document.title = `${meta.title} — QR varaqasi`;
  sheet.innerHTML = `
    <div class="kicker">Umumiy albom</div>
    <h1 class="names">${esc(meta.title)}</h1>
    <div class="date">${formatDate(meta.date)}</div>
        <div class="qr">
      <img src="/api/qr/${encodeURIComponent(meta.id)}" alt="QR kod" width="240" height="240">
    </div>

    <p class="call">Bugungi suratlaringizni biz bilan bo'lishing</p>
    <p class="hint">
      Telefon kamerangizni QR kodga tuting va ochilgan sahifaga rasmlaringizni
      qo'shing. Ilova o'rnatish yoki ro'yxatdan o'tish shart emas.
    </p>

    <p class="manzil">
      Kamera o'qimasa, brauzerga yozing:<br>
      <b>${esc(location.host)}/e/${esc(meta.id)}</b>
    </p>

    <div class="foot">Chaqnoq</div>`;
})();
</script>
</body>
</html>
