<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albom · Tadam</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex">
<meta property="og:title" content="Umumiy albom · Tadam">
<meta property="og:description" content="Suratlaringizni albomga qo'shing — ilova o'rnatmasdan, ro'yxatdan o'tmasdan.">
<meta property="og:type" content="website">
<meta property="og:locale" content="uz_UZ">
<meta property="og:image" content="https://chaqnoq.uz/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/inter-var-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/plex-mono-400-latin.woff2">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* Sahifa ustun bo'lib cho'ziladi: albom bo'sh bo'lsa ham yuklash paneli
     ekranning pastida turadi, kontent ostida osilib qolmaydi. */
  body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
  /* width:100% shart: flex ustunda `.wrap` ning `margin:0 auto` si `stretch`ni
     bekor qiladi va element kontent kengligiga qisqarib qoladi. */
  main { flex: 1 0 auto; width: 100%; }
  .dock { flex: none; }

  .hero {
    padding: clamp(36px, 9vw, 68px) 0 clamp(24px, 5vw, 36px);
    text-align: center;
  }
  .hero .names { margin-bottom: 12px; }
  .hero .date {
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--subtle);
  }

  /* Yuklash paneli sahifa pastida qotib turadi — mehmon galereyani ko'rib
     turib ham istalgan payt rasm qo'sha oladi. */
  .dock {
    position: sticky;
    bottom: 0;
    z-index: 20;
    padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .dock-inner { max-width: var(--wrap); margin: 0 auto; }

  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-m);
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .empty {
    text-align: center;
    padding: clamp(40px, 12vw, 90px) 20px;
    color: var(--muted);
  }
  .empty svg { margin: 0 auto 18px; display: block; opacity: .35; }

  .count-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }

  footer.site {
    padding: 40px 0 16px;
    text-align: center;
    color: var(--muted);
    font-size: .8125rem;
  }
  /* Bu pastki qatordagi "Tadam" — mehmon uchun mahsulotni bilib
     olishning yagona yo'li. Avval u atrofidagi matn bilan bir xil rangda
     va tagsiz edi, ya'ni havola ekani umuman bilinmasdi. */
  footer.site a { color: var(--fg); display: inline-block; padding: 8px 0; }

  /* Muddat tugashiga bir hafta qolganda ko'rinishi ham o'zgaradi,
     faqat matni emas. */
  .count-line .soon { color: var(--fg); font-weight: 500; }

  /* Yuklanayotgan rasm katakchasi */
  .tile.pending::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(128,128,128,.4);
    background: color-mix(in oklab, var(--bg) 55%, transparent);
  }
  .tile.pending .spinner {
    position: absolute;
    top: 50%; left: 50%;
    margin: -9px 0 0 -9px;
    color: var(--fg);
    z-index: 1;
  }
  /* Qizil fon — yuklanmaganini, aylanma o'q esa bosib qayta urinish
     mumkinligini bildiradi. Avval faqat "!" chiqardi: mehmon na nima
     bo'lganini, na nima qilishni bilardi. */
  .tile.failed { cursor: pointer; }
  .tile.failed::after {
    content: "\21BB";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(220, 38, 38, .82);
    background: color-mix(in oklab, #dc2626 82%, transparent);
    color: #fff; font-weight: 700; font-size: 22px;
  }
</style>
</head>
<body>

<main id="app" class="wrap" aria-live="polite">
  <div class="hero">
    <div class="spinner" style="margin:0 auto;color:var(--muted)"></div>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Rasm">
  <button class="lb-close" id="lbClose" aria-label="Yopish">&times;</button>
  <button class="lb-del hidden" id="lbDel" type="button" aria-label="Rasmni o'chirish">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6.5h16M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.5 6.5l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.2"/>
    </svg>
  </button>
  <a class="lb-save" id="lbSave" download aria-label="Rasmni saqlash">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/>
    </svg>
  </a>
  <button class="lb-nav prev" id="lbPrev" aria-label="Oldingi">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" id="lbNext" aria-label="Keyingi">&#8250;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script type="module">
import { processImageSafe, pool, withCpuLock, CONCURRENCY } from '/assets/compress.js';

const params  = new URLSearchParams(location.search);
const eventId = (params.get('i') || '').trim();
// Albom egasi boshqaruv sahifasidan kalit bilan kirsa, u istalgan rasmni
// o'chira oladi. Oddiy mehmonda bu kalit yo'q.
const ownerKey = (params.get('k') || '').trim();
const app     = document.getElementById('app');

/**
 * Mehmon o'zi qo'shgan rasmlarning o'chirish kalitlari shu brauzerda
 * saqlanadi — "adashib boshqa rasm yubordim" holati yordam so'rashsiz
 * hal bo'lsin. Yashirin rejimda localStorage yopiq bo'lishi mumkin,
 * shuning uchun hamma joyda try/catch.
 */
const DEL_STORE = `tadam.del.${eventId}`;

function delKeys() {
  try { return JSON.parse(localStorage.getItem(DEL_STORE) || '{}'); }
  catch { return {}; }
}
function rememberDelKey(photoId, key) {
  if (!key) return;
  try {
    const all = delKeys();
    all[photoId] = key;
    localStorage.setItem(DEL_STORE, JSON.stringify(all));
  } catch { /* saqlanmasa ham rasm yuklandi — muhimi shu */ }
}
function forgetDelKey(photoId) {
  try {
    const all = delKeys();
    delete all[photoId];
    localStorage.setItem(DEL_STORE, JSON.stringify(all));
  } catch { /* e'tiborsiz */ }
}
/** Shu rasmni o'chirish mumkinmi va qaysi kalit bilan? */
function deleteAuth(photoId) {
  if (ownerKey) return `k=${encodeURIComponent(ownerKey)}`;
  const key = delKeys()[photoId];
  return key ? `d=${encodeURIComponent(key)}` : null;
}

const MAX_FILES_AT_ONCE = 40;

/* --- Ko'rinish ----------------------------------------------------------- */

function fail(message) {
  app.innerHTML = `
    <div class="hero">
      <h1 class="names">Albom topilmadi</h1>
      <p class="muted" style="max-width:38ch;margin:14px auto 0">${message}</p>
    </div>`;
}

function formatDate(iso) {
  if (!iso) return '';
  const months = ['yanvar','fevral','mart','aprel','may','iyun',
                  'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const d = new Date(iso + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function render(meta) {
  document.title = `${meta.title} · Tadam`;
  app.innerHTML = `
    <div class="hero">
      <h1 class="names">${escapeHtml(meta.title)}</h1>
      <div class="date">${formatDate(meta.date)}</div>
    </div>

    <div class="count-line">
      <span class="eyebrow" id="count">Albom bo'sh</span>
      <span class="small muted" id="expiry"></span>
    </div>

    <div id="gallery" class="grid"></div>

    <div class="empty" id="empty">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="15" rx="2.5"/>
        <circle cx="12" cy="12.5" r="3.6"/>
        <path d="M8 5l1.4-2h5.2L16 5"/>
      </svg>
      <p style="margin:0">Birinchi rasmni siz qo'shing.</p>
    </div>

    <footer class="site">
      <a class="link" href="/">Tadam</a> bilan yaratilgan ·
      <a class="link" href="/maxfiylik/">Maxfiylik</a>
    </footer>
  `;
  if (meta.expiresAt) {
    const days = Math.ceil((new Date(meta.expiresAt) - Date.now()) / 86400000);
    if (days > 0) {
      const expiry = document.getElementById('expiry');
      expiry.textContent = days > 7 ? `${days} kun ochiq` : `${days} kundan keyin yopiladi`;
      if (days <= 7) expiry.classList.add('soon');
    }
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* --- Galereya ------------------------------------------------------------ */

let observer;

/**
 * Lightbox tartibi DOM'dan olinadi, alohida massivdan emas.
 * Sabab: rasmlar parallel yuklanadi va tugash tartibi ekrandagi tartib bilan
 * mos kelmaydi — massiv bilan ishlaganda "keyingi rasm" noto'g'ri chiqadi.
 */
const readyTiles = () => [...document.querySelectorAll('#gallery .tile[data-ready]')];
const readyIds   = () => readyTiles().map(t => t.dataset.id);

function ensureObserver() {
  if (observer) return observer;
  observer = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const img = en.target;
      // Tinglovchi src'dan OLDIN — keshdan kelgan rasmda hodisa o'tkazib
      // yuborilmasin. Bo'sh katakcha mehmon uchun buzilgan sahifa demak.
      const reveal = () => img.classList.add('in');
      img.addEventListener('load', reveal, { once: true });
      img.addEventListener('error', reveal, { once: true });
      img.src = img.dataset.src;
      if (img.complete && img.naturalWidth) reveal();
      observer.unobserve(img);
    }
  }, { rootMargin: '400px 0px' });
  return observer;
}

function addTile(photoId, atStart = false) {
  const gallery = document.getElementById('gallery');
  const btn = document.createElement('button');
  btn.className = 'tile';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Rasmni ochish');

  const img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  btn.appendChild(img);

  btn.addEventListener('click', () => {
    if (btn.dataset.ready) openLightbox(btn.dataset.id);
  });

  if (photoId) markReady(btn, photoId);

  if (atStart) gallery.prepend(btn); else gallery.appendChild(btn);
  return btn;
}

/**
 * Katakchani haqiqiy rasmga bog'laydi.
 * `fetchThumb` faqat serverdan kelgan rasmlar uchun kerak — endigina
 * yuklangan rasmning nusxasi telefonning o'zida allaqachon ko'rinib turibdi,
 * uni qaytadan yuklab olish ortiqcha trafik.
 */
function markReady(tile, photoId, fetchThumb = true) {
  tile.dataset.id = photoId;
  tile.dataset.ready = '1';
  if (!fetchThumb) return;
  const img = tile.querySelector('img');
  img.dataset.src = `/f/${eventId}/t/${photoId}`;
  ensureObserver().observe(img);
}

function updateCount() {
  const n = readyTiles().length;
  document.getElementById('count').textContent = n === 0 ? "Albom bo'sh" : `${n} ta rasm`;
  document.getElementById('empty').classList.toggle('hidden', n > 0);
}

/* --- Lightbox ------------------------------------------------------------ */

const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbSave = document.getElementById('lbSave');
const lbCount = document.getElementById('lbCount');
const lbDel = document.getElementById('lbDel');
let lbList = [];
let lbIndex = -1;

function openLightbox(id) {
  lbList = readyIds();
  lbIndex = lbList.indexOf(id);
  if (lbIndex < 0) return;
  showLightbox();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function showLightbox() {
  const photoId = lbList[lbIndex];
  lbImg.src = `/f/${eventId}/p/${photoId}`;
  // Suratni saqlash — avval umuman yo'l yo'q edi, faqat uzoq bosish.
  lbSave.href = lbImg.src;
  lbSave.download = `tadam-${photoId}.jpg`;
  // Albomda qayerdaligini ko'rsatadi; usiz uzun albomda yo'nalish yo'qoladi.
  lbCount.textContent = `${lbIndex + 1} / ${lbList.length}`;

  // O'chirish tugmasi faqat huquqi borida ko'rinadi va har safar
  // tasdiqlanmagan holatga qaytadi.
  resetDelButton();
  lbDel.classList.toggle('hidden', !deleteAuth(photoId));
}

function resetDelButton() {
  lbDel.classList.remove('confirm');
  lbDel.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6.5h16M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.5 6.5l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.2"/>
    </svg>`;
  lbDel.setAttribute('aria-label', 'Rasmni o\'chirish');
}

/**
 * Ikki bosqichli o'chirish: birinchi bosishda tugma "O'chirilsinmi?"
 * ga aylanadi. Oyna emas, chunki bu yerda oyna suratni yopib qo'yadi va
 * telefonda qo'pol ko'rinadi. Rasm qaytmaydi — shoshilinch bosilmasin.
 */
let delSoraldi = false;
lbDel.addEventListener('click', async () => {
  const photoId = lbList[lbIndex];
  const auth = deleteAuth(photoId);
  if (!auth) return;

  if (!delSoraldi) {
    delSoraldi = true;
    lbDel.classList.add('confirm');
    lbDel.textContent = "O'chirilsinmi?";
    setTimeout(() => { if (delSoraldi) { delSoraldi = false; resetDelButton(); } }, 4000);
    return;
  }

  delSoraldi = false;
  lbDel.classList.add('confirm');
  lbDel.textContent = "O'chirilmoqda…";
  try {
    const res = await fetch(
      `/api/photo/${encodeURIComponent(eventId)}/${encodeURIComponent(photoId)}?${auth}`,
      { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());

    forgetDelKey(photoId);
    document.querySelector(`#gallery .tile[data-id="${photoId}"]`)?.remove();
    updateCount();

    // Ro'yxatdan chiqarib, keyingi rasmga o'tamiz. Albom bo'shab qolsa —
    // yopamiz, aks holda bo'sh oyna qoladi.
    lbList.splice(lbIndex, 1);
    if (!lbList.length) return closeLightbox();
    if (lbIndex >= lbList.length) lbIndex = 0;
    showLightbox();
  } catch (e) {
    console.error(e);
    lbDel.textContent = "O'chmadi, qayta urining";
    setTimeout(resetDelButton, 2600);
  }
});
function closeLightbox() {
  lb.classList.remove('on');
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
  delSoraldi = false;
  resetDelButton();
}
function step(delta) {
  if (!lbList.length) return;
  lbIndex = (lbIndex + delta + lbList.length) % lbList.length;
  showLightbox();
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });

/* Barmoq bilan surish. Telefonda suratlarni ko'rishning odatiy usuli shu —
   ilgari faqat 44px lik o'q tugmalari va klaviatura ishlardi. */
let swipeX = null, swipeY = null;
lb.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { swipeX = null; return; }
  swipeX = e.touches[0].clientX;
  swipeY = e.touches[0].clientY;
}, { passive: true });
lb.addEventListener('touchend', (e) => {
  if (swipeX === null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  const dy = e.changedTouches[0].clientY - swipeY;
  swipeX = null;
  // Vertikal harakat kattaroq bo'lsa — bu surish emas, tasodifiy tegish.
  if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  step(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* --- Yuklash ------------------------------------------------------------- */

function buildDock() {
  const dock = document.createElement('div');
  dock.className = 'dock';
  dock.innerHTML = `
    <div class="dock-inner">
      <div id="progressWrap" class="progress-card hidden">
        <div class="row between" style="margin-bottom:10px">
          <span class="small" id="progressText">Tayyorlanmoqda…</span>
          <span class="small muted mono" id="progressCount"></span>
        </div>
        <div class="bar"><i id="progressBar"></i></div>
      </div>
      <label class="btn btn-primary btn-lg btn-block" for="picker">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Rasm qo'shish
      </label>
      <input id="picker" type="file" accept="image/*" multiple class="sr-only">
      <p class="small muted center" style="margin:10px 0 0">
        Ro'yxatdan o'tish ham, ilova o'rnatish ham shart emas
      </p>
    </div>`;
  document.body.appendChild(dock);
  document.getElementById('picker').addEventListener('change', onPick);
}

let busy = false;

/** Bitta rasmni siqib serverga yuboradi va yangi rasm id'sini qaytaradi. */
async function uploadOne(file) {
  // Siqish navbat bilan (protsessor), yuklash parallel (tarmoq).
  const { full, thumb } = await withCpuLock(() => processImageSafe(file));
  const fd = new FormData();
  fd.append('full', full, 'f.jpg');
  if (thumb) fd.append('thumb', thumb, 't.jpg');

  const res = await fetch(`/api/upload/${encodeURIComponent(eventId)}`, {
    method: 'POST', body: fd,
  });
  if (!res.ok) throw new Error(await res.text());
  const { id, delKey } = await res.json();
  rememberDelKey(id, delKey);
  return id;
}

function finishTile(tile, id) {
  tile.classList.remove('pending', 'failed');
  tile.querySelector('.spinner')?.remove();
  tile.onclick = null;
  tile.setAttribute('aria-label', 'Rasmni ochish');
  markReady(tile, id, false);
}

/**
 * Yuklanmagan katakcha bosilsa qayta uriniladi. To'yxona tarmog'i uzilib
 * turadi va bitta xato butun rasmni yo'qotmasligi kerak; avval faqat
 * qizil "!" chiqar, mehmonda esa hech qanday yo'l qolmasdi.
 */
function markFailed(tile, file) {
  tile.classList.remove('pending');
  tile.classList.add('failed');
  tile.querySelector('.spinner')?.remove();
  tile.setAttribute('aria-label', 'Yuklanmadi — qayta urinish uchun bosing');
  tile.onclick = async () => {
    if (tile.dataset.retrying) return;
    tile.dataset.retrying = '1';
    tile.classList.remove('failed');
    tile.classList.add('pending');
    tile.insertAdjacentHTML('beforeend', '<span class="spinner"></span>');
    try {
      finishTile(tile, await uploadOne(file));
      updateCount();
    } catch (err) {
      console.error(err);
      markFailed(tile, file);
    }
    delete tile.dataset.retrying;
  };
}

async function onPick(e) {
  const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
  e.target.value = '';
  if (!files.length || busy) return;

  if (files.length > MAX_FILES_AT_ONCE) {
    alert(`Bir vaqtda ${MAX_FILES_AT_ONCE} tagacha rasm yuklash mumkin. Qolganini keyin qo'shing.`);
    files.length = MAX_FILES_AT_ONCE;
  }

  busy = true;
  const wrap  = document.getElementById('progressWrap');
  const bar   = document.getElementById('progressBar');
  const text  = document.getElementById('progressText');
  const label = document.getElementById('progressCount');
  wrap.classList.remove('hidden');
  text.textContent = 'Yuklanmoqda…';

  let done = 0, failed = 0;
  const tick = () => {
    bar.style.width = ((done + failed) / files.length * 100) + '%';
    label.textContent = `${done + failed} / ${files.length}`;
  };
  tick();

  // Har bir fayl uchun darhol katakcha ko'rsatamiz — mehmon nima
  // bo'layotganini ko'rib turadi, kutish qisqaroq tuyuladi.
  const tiles = files.map(file => {
    const tile = addTile(null, true);
    tile.classList.add('pending');
    tile.insertAdjacentHTML('beforeend', '<span class="spinner"></span>');
    // Ko'rib turish uchun mahalliy nusxa — serverga yetib borishini kutmaymiz.
    const url = URL.createObjectURL(file);
    const img = tile.querySelector('img');
    img.src = url;
    img.addEventListener('load', () => {
      img.classList.add('in');
      URL.revokeObjectURL(url);
    }, { once: true });
    return tile;
  });

  await pool(files, CONCURRENCY, async (file, i) => {
    const tile = tiles[i];
    try {
      finishTile(tile, await uploadOne(file));
      done++;
    } catch (err) {
      console.error(err);
      markFailed(tile, file);
      failed++;
    }
    tick();
    updateCount();
  });

  text.textContent = failed
    ? `${done} ta yuklandi, ${failed} tasi yuklanmadi — qizil katakchani bosib qayta urinib ko'ring`
    : `Ta-dam! ${done} ta rasm albomda. Rahmat!`;
  bar.style.width = '100%';
  busy = false;
  setTimeout(() => wrap.classList.add('hidden'), failed ? 6000 : 2600);
}

/* --- Ishga tushirish ----------------------------------------------------- */

(async function init() {
  if (!eventId) return fail('Havola to\'liq emas. QR kodni qaytadan skanerlab ko\'ring.');

  let meta;
  try {
    const res = await fetch(`/api/event/${encodeURIComponent(eventId)}`);
    if (res.status === 404) return fail('Bunday albom yo\'q yoki muddati tugagan.');
    if (!res.ok) throw new Error('server');
    meta = await res.json();
  } catch {
    return fail('Internetga ulanishda muammo bo\'ldi. Sahifani yangilab ko\'ring.');
  }

  render(meta);
  buildDock();
  updateCount();

  try {
    const res = await fetch(`/api/photos/${encodeURIComponent(eventId)}`);
    if (res.ok) {
      const list = await res.json();
      for (const p of list.photos) addTile(p.id);
      updateCount();
    }
  } catch { /* galereya bo'sh qoladi, yuklash baribir ishlaydi */ }
})();
</script>
