name = "lahza"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Statik sahifalar.
#
# `run_worker_first` — Worker HAR BIR so'rovdan oldin ishlaydi. Usiz mos
# fayl topilsa Worker chetlab o'tiladi va PRIMARY_HOST yo'naltirishi
# bosh sahifada umuman ishlamaydi (aynan shu xato bo'lgan edi).
# Worker o'z ishini bajargach `env.ASSETS.fetch()` bilan faylni beradi.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Barcha rasm va meta shu bucket'da. Cloudflare panelida shu nom bilan
# R2 bucket yarating (yoki nomni bu yerda o'zgartiring).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lahza-photos"

# Barcha eski manzillar (workers.dev) asosiy domenga 301 bilan
# yo'naltiriladi — shunda Google reytingni ikki manzilga bo'lmaydi va
# chop etilgan eski QR kodlar ham ishlashda davom etadi.
# Yoqilgan: 2026-08-25, DNS to'liq tarqalgach.
[vars]
PRIMARY_HOST = "chaqnoq.uz"
