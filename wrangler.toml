name = "lahza"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Statik sahifalar.
#
# `run_worker_first` — Worker HAR BIR so'rovdan oldin ishlaydi. Usiz mos
# fayl topilsa Worker chetlab o'tiladi va PRIMARY_HOST yo'naltirishi
# bosh sahifada umuman ishlamaydi (aynan shu xato bo'lgan edi).
# Worker o'z ishini bajargach `env.ASSETS.fetch()` bilan faylni beradi.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Barcha rasm va meta shu bucket'da. Cloudflare panelida shu nom bilan
# R2 bucket yarating (yoki nomni bu yerda o'zgartiring).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lahza-photos"

# Barcha eski manzillar (workers.dev) asosiy domenga 301 bilan
# yo'naltiriladi — shunda Google reytingni ikki manzilga bo'lmaydi va
# chop etilgan eski QR kodlar ham ishlashda davom etadi.
# Yoqilgan: 2026-08-25, DNS to'liq tarqalgach.
[vars]
PRIMARY_HOST = "chaqnoq.uz"

# Albom yaratishga chastota chegarasi.
#
# ATAYLAB faqat YARATISHGA qo'yilgan, rasm yuklashga EMAS: to'yxonada
# yuzlab mehmon bitta Wi-Fi orqali chiqadi, ya'ni ular uchun IP bitta.
# Yuklashga IP bo'yicha chegara qo'yilsa, birinchi mehmondan keyin
# qolganlari to'silib qolardi. Yuklashni MAX_PHOTOS (1500) cheklaydi.
#
# `period` faqat 10 yoki 60 bo'lishi mumkin. Chegara IP bo'yicha va har bir
# Cloudflare markazida alohida sanaladi — bu qat'iy kvota emas, keng
# ko'lamli avtomatik so'rovlarga qarshi to'siq.
[[ratelimits]]
name = "ALBUM_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Quyidagi uchtasi Cloudflare panelida SHIFRLANGAN o'zgaruvchi sifatida
# qo'yiladi (Settings -> Variables and Secrets -> Encrypt). Repo ochiq
# bo'lgani uchun ular bu yerda hech qachon yozilmaydi:
#
#   ADMIN_KEY       /nazorat/ sahifasini ochadigan kalit. Qo'yilmasa
#                   sahifa umuman yo'q — 404.
#   TELEGRAM_TOKEN  BotFather bergan bot tokeni (ixtiyoriy).
#   TELEGRAM_CHAT   Xabar keladigan chat id (ixtiyoriy).
#
# Telegram o'zgaruvchilari qo'yilmasa xabar yuborilmaydi, qolgan hamma
# narsa avvalgidek ishlaydi.
