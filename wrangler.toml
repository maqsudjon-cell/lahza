name = "lahza"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Statik sahifalar. Mos fayl topilsa Worker umuman ishga tushmaydi —
# shuning uchun galereya va bosh sahifa CDN tezligida ochiladi.
[assets]
directory = "./public"
binding = "ASSETS"

# Barcha rasm va meta shu bucket'da. Cloudflare panelida shu nom bilan
# R2 bucket yarating (yoki nomni bu yerda o'zgartiring).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "lahza-photos"

# Domen ulangach shu qatorni oching — barcha eski manzillar (workers.dev)
# asosiy domenga 301 bilan yo'naltiriladi va Google reytingni bo'lmaydi.
# [vars]
# PRIMARY_HOST = "chaqnoq.uz"
